# All pipeline settings. Secrets (FIRMS_MAP_KEY) live in .env, never here.

# Countries whose sites are monitored. Names must match FIRMS country-archive
# file names (e.g. "United_Kingdom", not "United Kingdom").
countries: [Poland]

# Extra countries downloaded only so the ground-truth recall test can cover
# known incidents outside the pilot country.
validation_countries: [Germany, Lithuania, United_Kingdom]

date_range:
  start: 2019-01-01
  end: 2025-12-31

paths:
  raw: data/raw
  interim: data/interim
  out: data/out
  ground_truth: data/ground_truth/known_incidents.csv

firms:
  # Public yearly per-country CSVs (standard processing, includes `type`).
  # No MAP_KEY needed. NOAA-21 is not published here.
  archive_base_url: https://firms.modaps.eosdis.nasa.gov/data/country
  archive_products: [modis, viirs-snpp, viirs-jpss1]

  # Area API, used for products missing from the country archive.
  # Verified 2026-11-02 at https://firms.modaps.eosdis.nasa.gov/api/area/ :
  #   /api/area/csv/{MAP_KEY}/{SOURCE}/{west,south,east,north}/{DAY_RANGE 1..5}/{YYYY-MM-DD}
  #   MAP_KEY limit 5000 transactions / 10 min; multi-day requests may count as several.
  api_base_url: https://firms.modaps.eosdis.nasa.gov
  api_sources: [VIIRS_NOAA21_SP]
  api_max_day_range: 5
  api_min_request_interval_s: 1.0

  # west, south, east, north (WGS84). Used only by the Area API.
  country_bbox:
    Poland: [14.07, 49.00, 24.15, 54.84]
    Germany: [5.86, 47.27, 15.04, 55.06]
    Lithuania: [20.93, 53.89, 26.84, 56.45]
    United_Kingdom: [-8.65, 49.86, 1.77, 60.86]

# Stage 4 significance rule; Stage 6 sweeps min_sum_frp_mw to calibrate it.
significance:
  min_viirs_detections: 2
  min_modis_detections: 1
  min_sum_frp_mw: 20.0

validation:
  # Matching radius around a known incident, added to the incident's own
  # coordinate uncertainty. Sensor pixel sizes: VIIRS 375 m, MODIS 1 km.
  radius_m:
    VIIRS: 400
    MODIS: 1000
  # Window around the reported start time. Reported times lag ignition, and
  # large fires can burn or smoulder for days.
  hours_before: 6
  hours_after: 72
  frp_thresholds_mw: [0, 5, 10, 20, 50, 100]
