[project]
name = "firms-monitor"
version = "0.1.0"
description = "NASA FIRMS active-fire overlay on European defense-supply-chain warehouse sites"
readme = "README.md"
authors = [
    { name = "thomaswesleyb", email = "twesleybailey@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas==1.2.0",
    "httpx==0.28.1",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "shapely==2.2.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[project.scripts]
firms-monitor = "firms_monitor.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "TID", "C90", "PL", "D"]
ignore = ["D100", "D104", "D105", "D107", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
